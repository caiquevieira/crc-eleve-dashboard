<!doctype html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --border: rgba(11,11,11,0.12);
  --accent: #2a78d6; --accent-ink: #ffffff; --wash: rgba(42,120,214,0.08);
  --good: #006300; --good-bg: rgba(12,163,12,0.12);
  --warn: #8a5a00; --warn-bg: rgba(250,178,25,0.18);
  --bad: #b22a2a; --bad-bg: rgba(208,59,59,0.12);
  --info: #1c5cab; --info-bg: rgba(42,120,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --border: rgba(255,255,255,0.12);
    --accent: #3987e5; --wash: rgba(57,135,229,0.14);
    --good: #4cc44c; --good-bg: rgba(12,163,12,0.18);
    --warn: #fab219; --warn-bg: rgba(250,178,25,0.16);
    --bad: #ef7d7d; --bad-bg: rgba(208,59,59,0.2);
    --info: #86b6ef; --info-bg: rgba(57,135,229,0.18);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 16px 16px 64px; }
button, input, select, textarea { font: inherit; color: inherit; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.top h1 { font-size: 20px; margin: 0; font-weight: 650; }
.who { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.who select { min-width: 140px; }

.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .6; cursor: progress; }

input, select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.views { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.view { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; color: var(--text-2); }
.view .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 12px; text-align: center; }
.view.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.view.on .n { background: rgba(255,255,255,.25); color: var(--accent-ink); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.toolbar input[type=search] { flex: 1 1 240px; }
.toolbar .spacer { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface); position: sticky; top: 0; }
tbody tr:hover { background: var(--wash); }
td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.when .d { font-weight: 600; }
td.when .h { color: var(--text-2); font-size: 12px; }
.name { font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.name:hover { color: var(--accent); text-decoration: underline; }
.phone { font-size: 12px; color: var(--text-2); }
.phone a { color: var(--text-2); }
.small { font-size: 12px; color: var(--text-2); }
td select { padding: 4px 6px; font-size: 13px; max-width: 170px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.info { color: var(--info); background: var(--info-bg); }
.chip.none { color: var(--muted); background: var(--surface-2); }
.st-good { border-color: var(--good); }
.st-bad { border-color: var(--bad); }
.st-warn { border-color: var(--warn); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.more { padding: 12px; text-align: center; }

/* Modal */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow: auto; z-index: 10; }
.backdrop.on { display: flex; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 760px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; font-size: 17px; }
.modal .x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--text-2); line-height: 1; }
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; padding: 18px 20px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
.form .s2 { grid-column: span 2; }
.form .s3 { grid-column: 1 / -1; }
.form h3 { grid-column: 1 / -1; margin: 6px 0 -4px; font-size: 13px; color: var(--text); }
.req::after { content: " *"; color: var(--bad); }
.modal footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal footer .left { margin-right: auto; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--page); padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 20; max-width: calc(100% - 32px); }
.toast.on { display: block; }
.toast.err { background: var(--bad); color: #fff; }
.loading { padding: 60px 16px; text-align: center; color: var(--muted); }

@media (max-width: 820px) {
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  td { border: 0; padding: 0; }
  td.when { grid-column: 2; grid-row: 1; text-align: right; }
  td.pac { grid-column: 1; grid-row: 1; }
  td.c-camp, td.c-clin, td.c-crc { display: none; }
  td.c-conf, td.c-st, td.c-fech { grid-column: 1 / -1; display: inline-block; width: auto; }
  td select { max-width: 100%; }
  .form { grid-template-columns: 1fr 1fr; }
  .form .s2 { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>CRM Eleve</h1>
    <div class="who">
      <span>Você é</span>
      <select id="meuNome" aria-label="Seu nome (CRC)"></select>
      <button class="btn primary" id="novo">+ Novo agendamento</button>
    </div>
  </div>

  <div class="views" id="views" role="tablist"></div>

  <div class="toolbar">
    <input type="search" id="busca" placeholder="Buscar por nome ou telefone…" aria-label="Buscar">
    <select id="fStatus" aria-label="Filtrar status"><option value="">Todos os status</option></select>
    <select id="fCrc" aria-label="Filtrar CRC"><option value="">Todas as CRCs</option></select>
    <button class="btn" id="recarregar" title="Buscar alterações feitas por outras pessoas">Recarregar</button>
  </div>

  <div class="card">
    <div id="lista"><div class="loading">Carregando agendamentos…</div></div>
  </div>
</div>

<div class="backdrop" id="bd">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle">Novo agendamento</h2><button class="x" id="fechar" aria-label="Fechar">×</button></header>
    <form class="form" id="form" autocomplete="off">
      <h3>Paciente</h3>
      <label class="s2"><span class="req">Nome</span><input name="nome" required></label>
      <label><span class="req">Telefone</span><input name="telefone" inputmode="tel" required placeholder="11 99999-9999"></label>
      <label>Data de nascimento<input type="date" name="nascimento"></label>
      <label>Campanha / origem<input name="campanha" list="dl-campanha"></label>
      <label>CRC<select name="crc" id="sel-crc"></select></label>

      <h3>Consulta</h3>
      <label>Clínica<input name="clinica" list="dl-clinica"></label>
      <label><span class="req">Data da consulta</span><input type="date" name="dataConsulta" required></label>
      <label>Hora<input type="time" name="hora" step="900"></label>
      <label>Meio de agendamento<select name="meio" id="sel-meio"></select></label>
      <label>Fez confirmação?<select name="confirmacao"><option value="">—</option><option>SIM</option><option>NÃO</option></select></label>
      <label>Status<select name="status" id="sel-status"></select></label>

      <h3>Resultado</h3>
      <label>Fechou?<input name="fechou" list="dl-fechou" placeholder="Sim, ou o motivo"></label>
      <label>Orçamento gerado<input name="orcamento"></label>
      <label>Valor de venda (R$)<input name="valor" inputmode="decimal" placeholder="0,00"></label>
      <label class="s3">Observação<textarea name="obs" rows="2"></textarea></label>
      <label>Data do agendamento<input type="date" name="dataAgend"></label>
    </form>
    <footer>
      <button class="btn danger left" id="excluir" type="button">Excluir</button>
      <button class="btn" id="cancelar" type="button">Cancelar</button>
      <button class="btn primary" id="salvar" type="button">Salvar</button>
    </footer>
  </div>
</div>

<datalist id="dl-campanha"></datalist>
<datalist id="dl-clinica"></datalist>
<datalist id="dl-fechou"><option>Sim</option><option>Não</option><option>Mora longe</option><option>Sem interesse</option><option>Valor alto</option><option>Vai pensar</option></datalist>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
  const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

  let S = { records: [], options: {}, today: '', meuNome: '' };
  let view = 'semana';
  let limit = 200;
  let editing = null;

  const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
  const ddmm = (s) => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
  const wd = (s) => { const [y, m, d] = s.split('-').map(Number); return WD[new Date(y, m - 1, d).getDay()]; };

  const isCancel = (st) => { const k = norm(st); return k === 'DESMARCOU' || k.startsWith('CANCELOU'); };
  const isFinal = (st) => isCancel(st) || ['COMPARECEU', 'FALTOU'].includes(norm(st));
  const confirmed = (r) => norm(r.confirmacao).startsWith('S');

  const VIEWS = [
    ['hoje', 'Hoje', (r) => r.dataConsulta === S.today],
    ['amanha', 'Amanhã', (r) => r.dataConsulta === addDays(S.today, 1)],
    ['semana', 'Próximos 7 dias', (r) => r.dataConsulta >= S.today && r.dataConsulta <= addDays(S.today, 6)],
    ['confirmar', 'A confirmar', (r) => r.dataConsulta >= S.today && r.dataConsulta <= addDays(S.today, 2) && !confirmed(r) && !isCancel(r.status)],
    ['atualizar', 'Status pendente', (r) => r.dataConsulta && r.dataConsulta < S.today && !isFinal(r.status)],
    ['todos', 'Todos', () => true],
  ];

  function statusClass(st) {
    const k = norm(st);
    if (!k) return 'none';
    if (k === 'COMPARECEU') return 'good';
    if (k === 'CONFIRMOU') return 'info';
    if (k === 'REAGENDADO') return 'warn';
    if (k === 'FALTOU' || isCancel(st)) return 'bad';
    return 'none';
  }

  function waLink(tel) {
    let d = String(tel || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length <= 11) d = '55' + d;
    return 'https://wa.me/' + d;
  }

  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast on' + (err ? ' err' : '');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.className = 'toast'; }, err ? 6000 : 2500);
  }

  function call(fn, ...args) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  }

  // ---------- render ----------
  function filtered() {
    const v = VIEWS.find((x) => x[0] === view);
    const q = norm($('#busca').value);
    const qd = q.replace(/\D/g, '');
    const st = $('#fStatus').value, crc = $('#fCrc').value;
    let rows = S.records.filter((r) => {
      if (q) {
        const hit = norm(r.nome).includes(q) || (qd.length >= 3 && String(r.telefone).replace(/\D/g, '').includes(qd));
        if (!hit) return false;
      } else if (!v[2](r)) return false;
      if (st && norm(r.status) !== norm(st)) return false;
      if (crc && r.crc !== crc) return false;
      return true;
    });
    const asc = view !== 'todos' && view !== 'atualizar' && !q;
    rows.sort((a, b) => {
      const ka = (a.dataConsulta || '0000') + (a.hora || ''), kb = (b.dataConsulta || '0000') + (b.hora || '');
      return asc ? ka.localeCompare(kb) : kb.localeCompare(ka);
    });
    return rows;
  }

  function renderViews() {
    $('#views').innerHTML = VIEWS.map(([k, label, fn]) => {
      const n = k === 'todos' ? S.records.length : S.records.filter(fn).length;
      return `<button class="view ${k === view ? 'on' : ''}" data-v="${k}" role="tab" aria-selected="${k === view}">${label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  function optionList(list, cur, blank = '—') {
    const vals = list.slice();
    if (cur && !vals.some((v) => norm(v) === norm(cur))) vals.push(cur);
    return `<option value="">${blank}</option>` + vals.map((v) => `<option ${norm(v) === norm(cur) ? 'selected' : ''}>${esc(v)}</option>`).join('');
  }

  function render() {
    renderViews();
    const rows = filtered();
    if (!rows.length) {
      $('#lista').innerHTML = `<div class="empty">${$('#busca').value ? 'Nenhum paciente encontrado.' : 'Nenhum agendamento nesta visão.'}</div>`;
      return;
    }
    const shown = rows.slice(0, limit);
    const st = S.options.status || [];
    $('#lista').innerHTML = `<table>
      <thead><tr><th>Consulta</th><th>Paciente</th><th>Campanha</th><th>Clínica</th><th>CRC</th><th>Confirmação</th><th>Status</th><th>Fechou</th></tr></thead>
      <tbody>${shown.map((r) => `
        <tr data-row="${r.row}">
          <td class="when">${r.dataConsulta ? `<div class="d">${wd(r.dataConsulta)} ${ddmm(r.dataConsulta)}</div>` : '<div class="small">sem data</div>'}<div class="h">${esc(r.hora)}</div></td>
          <td class="pac"><button class="name" data-edit="${r.row}">${esc(r.nome)}</button>
            <div class="phone">${r.telefone ? `<a href="${waLink(r.telefone)}" target="_blank" rel="noopener" title="Abrir no WhatsApp">${esc(r.telefone)}</a>` : ''}</div></td>
          <td class="c-camp small">${esc(r.campanha)}</td>
          <td class="c-clin small">${esc(r.clinica)}</td>
          <td class="c-crc small">${esc(r.crc)}</td>
          <td class="c-conf"><select data-q="confirmacao" aria-label="Fez confirmação">${optionList(['SIM', 'NÃO'], r.confirmacao)}</select></td>
          <td class="c-st"><select data-q="status" class="st-${statusClass(r.status)}" aria-label="Status">${optionList(st, r.status)}</select></td>
          <td class="c-fech">${r.fechou ? `<span class="chip ${norm(r.fechou).startsWith('SIM') ? 'good' : 'none'}">${esc(r.fechou)}</span>` : ''}</td>
        </tr>`).join('')}</tbody></table>
      ${rows.length > limit ? `<div class="more"><button class="btn" id="maisBtn">Mostrar mais (${rows.length - limit})</button></div>` : ''}`;
  }

  // ---------- form ----------
  function fillSelect(sel, list, blank) { sel.innerHTML = optionList(list, '', blank); }

  function openForm(rec) {
    editing = rec || null;
    const f = $('#form');
    f.reset();
    $('#mTitle').textContent = rec ? 'Editar agendamento' : 'Novo agendamento';
    $('#excluir').style.display = rec ? '' : 'none';
    const r = rec || { dataAgend: S.today, crc: S.meuNome, confirmacao: '', meio: guessMeio() };
    $('#sel-crc').innerHTML = optionList(S.options.crc || [], r.crc);
    $('#sel-meio').innerHTML = optionList(S.options.meio || [], r.meio);
    $('#sel-status').innerHTML = optionList(S.options.status || [], r.status);
    for (const el of f.elements) {
      if (!el.name || el.tagName === 'SELECT' && ['crc', 'meio', 'status'].includes(el.name)) continue;
      let v = r[el.name] || '';
      if (el.name === 'hora') v = toTime(v);
      if (el.name === 'confirmacao') { el.value = norm(v).startsWith('S') ? 'SIM' : norm(v).startsWith('N') ? 'NÃO' : ''; continue; }
      el.value = v;
    }
    $('#bd').classList.add('on');
    setTimeout(() => f.elements.nome.focus(), 30);
  }

  function guessMeio() { const m = (S.options.meio || []).find((x) => norm(x) === 'WHATSAPP'); return m || ''; }
  const toTime = (h) => { const m = String(h || '').match(/(\d{1,2})\s*[hH:]\s*(\d{2})?/); return m ? `${m[1].padStart(2, '0')}:${m[2] || '00'}` : ''; };
  const fromTime = (t) => t ? t.replace(':', 'h') : '';

  function parseValor(s) {
    s = String(s || '').trim();
    if (!s) return '';
    s = s.replace(/[R$\s]/g, '');
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return isFinite(n) ? n : null;
  }

  function closeForm() { $('#bd').classList.remove('on'); editing = null; }

  async function save() {
    const f = $('#form');
    if (!f.reportValidity()) return;
    const rec = Object.fromEntries([...f.elements].filter((e) => e.name).map((e) => [e.name, e.value.trim()]));
    rec.hora = fromTime(rec.hora);
    const valor = parseValor(rec.valor);
    if (valor === null) { toast('Valor de venda inválido. Use, por exemplo, 1.500,00', true); return; }
    rec.valor = valor;
    if (editing) { rec.row = editing.row; rec.orig = editing.nome; }
    await persist(rec, $('#salvar'));
  }

  async function persist(rec, btn) {
    if (btn) btn.disabled = true;
    try {
      const saved = await call('saveRecord', rec);
      const i = S.records.findIndex((x) => x.row === saved.row);
      if (i >= 0) S.records[i] = saved; else S.records.push(saved);
      closeForm();
      render();
      toast('Salvo na planilha');
    } catch (e) {
      toast(e.message || String(e), true);
      throw e;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // Edição rápida (confirmação / status) direto na lista
  async function quick(row, field, value, el) {
    const r = S.records.find((x) => x.row === row);
    if (!r) return;
    const rec = Object.assign({}, r, { [field]: value, orig: r.nome });
    el.disabled = true;
    try {
      const saved = await call('saveRecord', rec);
      Object.assign(r, saved);
      render();
      toast('Salvo na planilha');
    } catch (e) {
      toast(e.message || String(e), true);
      el.value = r[field] || '';
      el.disabled = false;
    }
  }

  let confirmDel = false;
  async function del() {
    if (!editing) return;
    if (!confirmDel) {
      confirmDel = true;
      $('#excluir').textContent = 'Confirmar exclusão';
      setTimeout(() => { confirmDel = false; $('#excluir').textContent = 'Excluir'; }, 4000);
      return;
    }
    confirmDel = false;
    $('#excluir').textContent = 'Excluir';
    try {
      await call('deleteRecord', editing.row, editing.nome);
      S.records = S.records.filter((x) => x.row !== editing.row);
      closeForm();
      render();
      toast('Agendamento excluído da planilha');
    } catch (e) { toast(e.message || String(e), true); }
  }

  // ---------- dados ----------
  async function load() {
    try {
      const b = await call('bootstrap');
      S = b;
      const crcs = b.options.crc || [];
      $('#meuNome').innerHTML = optionList(crcs, b.meuNome, 'Escolha…');
      $('#fCrc').innerHTML = '<option value="">Todas as CRCs</option>' + [...new Set(b.records.map((r) => r.crc).filter(Boolean))].sort().map((v) => `<option>${esc(v)}</option>`).join('');
      $('#fStatus').innerHTML = '<option value="">Todos os status</option>' + (b.options.status || []).map((v) => `<option>${esc(v)}</option>`).join('');
      $('#dl-campanha').innerHTML = (b.options.campanha || []).map((v) => `<option value="${esc(v)}">`).join('');
      $('#dl-clinica').innerHTML = (b.options.clinica || []).map((v) => `<option value="${esc(v)}">`).join('');
      render();
    } catch (e) {
      $('#lista').innerHTML = `<div class="empty">Não foi possível abrir a planilha: ${esc(e.message || e)}<br>Verifique se você tem permissão de edição na planilha.</div>`;
    }
  }

  // ---------- eventos ----------
  $('#views').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; view = b.dataset.v; limit = 200; render(); });
  $('#busca').addEventListener('input', () => { limit = 200; render(); });
  $('#fStatus').addEventListener('change', render);
  $('#fCrc').addEventListener('change', render);
  $('#recarregar').addEventListener('click', () => { $('#lista').innerHTML = '<div class="loading">Carregando…</div>'; load(); });
  $('#novo').addEventListener('click', () => openForm(null));
  $('#fechar').addEventListener('click', closeForm);
  $('#cancelar').addEventListener('click', closeForm);
  $('#salvar').addEventListener('click', () => save().catch(() => {}));
  $('#excluir').addEventListener('click', del);
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); save().catch(() => {}); });
  $('#bd').addEventListener('click', (e) => { if (e.target.id === 'bd') closeForm(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#bd').classList.contains('on')) closeForm(); });
  $('#meuNome').addEventListener('change', async (e) => {
    S.meuNome = e.target.value;
    try { await call('setMeuNome', S.meuNome); toast('Pronto! Novos agendamentos vêm com o seu nome.'); } catch (err) { toast(err.message, true); }
  });
  $('#lista').addEventListener('click', (e) => {
    const b = e.target.closest('[data-edit]');
    if (b) openForm(S.records.find((x) => x.row === Number(b.dataset.edit)));
    if (e.target.id === 'maisBtn') { limit += 200; render(); }
  });
  $('#lista').addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-q]');
    if (!sel) return;
    quick(Number(sel.closest('tr').dataset.row), sel.dataset.q, sel.value, sel);
  });

  load();
})();
</script>
</body>
</html>
