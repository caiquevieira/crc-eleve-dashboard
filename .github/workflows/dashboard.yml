name: Atualizar dashboard

on:
  push:
    branches: [main]
  schedule:
    # A cada 30 min, das 07h às 20h (horário de Brasília = UTC-3), seg a sáb
    - cron: "7,37 10-23 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install openpyxl==3.1.5

      - name: Gerar dados (sem dados pessoais)
        env:
          SHEET_FILE_ID: ${{ secrets.SHEET_FILE_ID }}
        run: python scripts/build_data.py --out site/data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
