<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM Eleve</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --text: #0b0b0b; --muted: #52514e; --accent: #2a78d6; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --text: #f0efec; --muted: #c3c2b7; --accent: #3987e5; } }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--page); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; text-align: center; }
a { color: var(--accent); font-weight: 600; }
p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px">CRM Eleve</h1>
  <p id="msg">Abrindo o CRM…</p>
</main>
<script>
fetch('../config.json?t=' + Date.now(), { cache: 'no-store' })
  .then((r) => r.json())
  .then((c) => {
    if (!c.crmUrl) throw new Error('sem link');
    document.getElementById('msg').innerHTML = 'Abrindo o CRM… Se não abrir, <a href="' + c.crmUrl.replace(/"/g, '') + '">clique aqui</a>.';
    location.replace(c.crmUrl);
  })
  .catch(() => {
    document.getElementById('msg').textContent = 'O link do CRM ainda não foi configurado.';
  });
</script>
</body>
</html>
